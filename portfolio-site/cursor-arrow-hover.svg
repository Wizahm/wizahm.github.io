<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#C7CDD4"/><stop offset="1" stop-color="#7D8691"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F06B6B"/><stop offset=".45" stop-color="#E53935"/><stop offset="1" stop-color="#8E1414"/>
    </linearGradient>
  </defs>
  <circle cx="4" cy="4" r="5" fill="#C9A227" opacity=".45"/>
  <g transform="translate(2.2 2.2) rotate(45)">
    <!-- fletching: two white vanes with grey outline and feather lining -->
    <path d="M57,-1.9 C61,-3.5 67,-8.6 74,-9.2 L78,-9.2 L77.2,-1.9 Z" fill="#FFFFFF" stroke="#4A4F57" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M57,1.9 C61,3.5 67,8.6 74,9.2 L78,9.2 L77.2,1.9 Z" fill="#FFFFFF" stroke="#4A4F57" stroke-width=".8" stroke-linejoin="round"/>
    <clipPath id="vanes">
      <path d="M57,-1.9 C61,-3.5 67,-8.6 74,-9.2 L78,-9.2 L77.2,-1.9 Z"/>
      <path d="M57,1.9 C61,3.5 67,8.6 74,9.2 L78,9.2 L77.2,1.9 Z"/>
    </clipPath>
    <g clip-path="url(#vanes)"><line x1="60.5" y1="-2.1" x2="64.7" y2="-7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="63.5" y1="-2.1" x2="67.7" y2="-7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="66.5" y1="-2.1" x2="70.7" y2="-7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="69.5" y1="-2.1" x2="73.7" y2="-7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="72.5" y1="-2.1" x2="76.7" y2="-7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="60.5" y1="2.1" x2="64.7" y2="7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="63.5" y1="2.1" x2="67.7" y2="7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="66.5" y1="2.1" x2="70.7" y2="7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="69.5" y1="2.1" x2="73.7" y2="7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/><line x1="72.5" y1="2.1" x2="76.7" y2="7.6" stroke="#AEB4BC" stroke-width=".55" stroke-linecap="round"/></g>
    <!-- shaft -->
    <rect x="13" y="-2.1" width="66" height="4.2" rx="1" fill="url(#wood)" stroke="#5E0B0B" stroke-width=".7"/>
    <!-- cresting band -->
    <rect x="52.5" y="-2.1" width="1.6" height="4.2" fill="#F4F4F4" stroke="#5E0B0B" stroke-width=".4"/>
    <!-- nock: U-shaped slot at the end where the bowstring sits -->
    <path d="M78,-3 H85.5 V-1.1 Q81.8,-1.1 81.8,0 Q81.8,1.1 85.5,1.1 V3 H78 Z" fill="#23272D" stroke="#0E1013" stroke-width=".6" stroke-linejoin="round"/>
    <!-- ferrule -->
    <rect x="11.5" y="-2.5" width="5" height="5" rx="1" fill="#8D96A1" stroke="#353A40" stroke-width=".6"/>
    <!-- V-shaped steel point with a centre ridge -->
    <path d="M0,0 L19,-8.2 L13.2,0 L19,8.2 Z" fill="url(#steel)" stroke="#2F343A" stroke-width=".8" stroke-linejoin="round"/>
    <line x1="1.2" y1="0" x2="13" y2="0" stroke="#5B636D" stroke-width=".6"/>
  </g>
</svg>
